services:
  web:
    build: .
    env_file: .env
    environment:
      # booking-api runs as a separate project; point at it (host networking shown for local dev)
      API_BASE_URL: http://host.docker.internal:8000/api
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
