{% load ui %}
{# Date strip + slot grid. Writes the selection into hidden inputs appointment_date / start_time. #}
<div data-slot-picker data-doctor="{{ doctor_id }}">
  <input type="hidden" name="appointment_date" value="{{ form.appointment_date }}">
  <input type="hidden" name="start_time" value="{{ form.start_time }}">
  <div class="d-flex justify-content-between align-items-center mb-2 flex-wrap gap-2">
    <span class="form-label mb-0">Select date</span>
    <input type="date" class="form-control form-control-sm" style="max-width:170px" data-date-input min="{% now 'Y-m-d' %}" aria-label="Pick any date">
  </div>
  <div class="date-strip" role="listbox" aria-label="Available dates">
    {% for d in dates %}
    <button type="button" class="date-chip {% if not d.free %}disabled{% endif %}" data-date="{{ d.date }}" {% if not d.free %}aria-disabled="true"{% endif %}>
      <div class="dow">{{ d.weekday }}</div>
      <div class="dom">{{ d.date|as_date|date:"d" }}</div>
      <div class="free">{% if d.free %}{{ d.free }} slots{% else %}Full / off{% endif %}</div>
    </button>
    {% endfor %}
  </div>
  <div class="mt-3">
    <span class="form-label">Available slots <span class="text-muted fw-normal" data-slot-date></span></span>
    <div data-slot-area>
      <div class="empty py-4"><div class="empty-icon"><i class="bi bi-calendar3"></i></div><p class="mb-0 small">Pick a date to see open time slots.</p></div>
    </div>
  </div>
</div>
