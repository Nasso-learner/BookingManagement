{% load ui %}
{% if pager.num_pages > 1 %}
<nav class="d-flex justify-content-between align-items-center flex-wrap gap-2 px-3 py-3 border-top" aria-label="Pagination">
  <span class="small text-muted">Page {{ pager.page }} of {{ pager.num_pages }} · {{ pager.count }} total</span>
  <ul class="pagination pagination-sm mb-0">
    <li class="page-item {% if not pager.has_prev %}disabled{% endif %}"><a class="page-link" href="?{% url_replace page=pager.page|add:'-1' %}" aria-label="Previous"><i class="bi bi-chevron-left"></i></a></li>
    {% for n in pager.range %}
    <li class="page-item {% if n == pager.page %}active{% endif %}"><a class="page-link" href="?{% url_replace page=n %}">{{ n }}</a></li>
    {% endfor %}
    <li class="page-item {% if not pager.has_next %}disabled{% endif %}"><a class="page-link" href="?{% url_replace page=pager.page|add:'1' %}" aria-label="Next"><i class="bi bi-chevron-right"></i></a></li>
  </ul>
</nav>
{% endif %}
