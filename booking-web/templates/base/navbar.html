<header class="topbar" id="topbar">
  <button class="icon-btn sidebar-toggle" type="button" data-sidebar-toggle aria-label="Open menu"><i class="bi bi-list"></i></button>
  <div class="greeting d-none d-sm-block">{% now "l, d F Y" %}</div>
  <div class="ms-auto d-flex align-items-center gap-2">
    <div class="dropdown">
      <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Notifications" id="notifBtn">
        <i class="bi bi-bell"></i><span class="dot d-none" id="notifCount"></span>
      </button>
      <div class="dropdown-menu dropdown-menu-end notif-menu">
        <div class="notif-head">
          <strong class="text-dark">Notifications</strong>
          <button class="btn btn-sm btn-soft" type="button" id="notifReadAll">Mark all read</button>
        </div>
        <div class="notif-list" id="notifList"><div class="empty py-4"><div class="spinner-ring mx-auto" style="width:28px;height:28px"></div></div></div>
      </div>
    </div>
    <div class="dropdown">
      <button class="user-menu" type="button" data-bs-toggle="dropdown" aria-label="Account menu">
        <span class="avatar avatar-sm">{{ me.initials }}</span>
        <span class="text-start"><span class="name d-block">{{ me.name }}</span><span class="role">{{ me.role|lower }}</span></span>
        <i class="bi bi-chevron-down small text-muted"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li class="px-3 py-2"><div class="fw-semibold text-dark small">{{ me.name }}</div><div class="text-muted small">{{ me.email }}</div></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="{{ me.dashboard }}"><i class="bi bi-grid-1x2 me-2"></i>Dashboard</a></li>
        {% if me.role != "ADMIN" %}<li><a class="dropdown-item" href="{{ me.dashboard }}profile/"><i class="bi bi-person me-2"></i>My profile</a></li>{% endif %}
        <li><hr class="dropdown-divider"></li>
        <li>
          <form method="post" action="/logout/">{% csrf_token %}
            <button class="dropdown-item text-danger" type="submit"><i class="bi bi-box-arrow-right me-2"></i>Sign out</button>
          </form>
        </li>
      </ul>
    </div>
  </div>
</header>
